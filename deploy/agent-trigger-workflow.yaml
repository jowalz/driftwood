main:
  params: [event]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GCP_REGION")}
          - message_json: ${text.decode(base64.decode(event.data.message.data))}
    - run_job:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/driftwood-agent"}
          location: ${region}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: PUBSUB_MESSAGE
                      value: ${message_json}
        result: job_execution
    - finish:
        return: ${job_execution}
